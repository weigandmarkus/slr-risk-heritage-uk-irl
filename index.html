<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drowning Heritage: UK & Ireland</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <h1>Drowning Heritage</h1>
            <p class="subtitle">The threat of sea level rise on archaeological sites in the UK and Ireland</p>
            
            <hr>

            <div class="control-group">
                <h3>1. Select Scenario</h3>
                <label class="radio-option">
                    <input type="radio" name="scenario" value="ssp1" checked>
                    <span>SSP1-2.6 (Paris Agreement)</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="scenario" value="ssp2">
                    <span>SSP2-4.5 (Middle of the Road)</span>
                </label>
                <label class="radio-option">
                    <input type="radio" name="scenario" value="ssp5">
                    <span>SSP5-8.5 (Fossil-Fueled)</span>
                </label>
            </div>

            <div class="control-group">
                <h3>2. Select Year</h3>
                <div class="year-selector">
                    <label class="radio-button">
                        <input type="radio" name="year" value="2050" checked>
                        <span>2050</span>
                    </label>
                    <label class="radio-button">
                        <input type="radio" name="year" value="2100">
                        <span>2100</span>
                    </label>
                    <label class="radio-button">
                        <input type="radio" name="year" value="2150">
                        <span>2150</span>
                    </label>
                </div>
            </div>

            <button id="update-btn" class="primary-btn">Update Map</button>
            <button id="reset-zoom-btn" class="secondary-btn">Reset Zoom</button>

            <div class="legend">
                <h4>Legend</h4>
                <div class="legend-item"><span class="dot red"></span> Flooding Zone</div>
                <div class="legend-item"><span class="dot yellow"></span> Affected Heritage Site</div>
            </div>
        </div>

        <div id="map" class="map"></div>
    </div>

    <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.9.0/proj4.js"></script>
    
    <script src="main.js"></script>
</body>
</html>
